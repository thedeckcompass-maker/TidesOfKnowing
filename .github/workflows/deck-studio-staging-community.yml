name: Deck Studio community staging migration

on:
  push:
    branches:
      - feature/deck-creator-studio-live
    paths:
      - .github/workflows/deck-studio-staging-community.yml

permissions:
  contents: read

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: deck-studio-staging
    env:
      STUDIO_STAGING_DATABASE_URL: ${{ secrets.STUDIO_STAGING_DATABASE_URL }}
      STUDIO_PROJECT_ID: 56976396-c97b-4a24-a097-e9331a5504a1
    steps:
      - uses: actions/checkout@v4
      - name: Confirm isolated Studio staging target
        shell: bash
        run: |
          if [[ -z "$STUDIO_STAGING_DATABASE_URL" || "$STUDIO_STAGING_DATABASE_URL" != *"utzcmbidotxgmulguzxo"* ]]; then
            echo "::error::The authorised Studio staging database is unavailable."
            exit 1
          fi
      - name: Install existing community schema in isolated staging
        shell: bash
        run: |
          psql "$STUDIO_STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --single-transaction \
            --file supabase/migrations/20260623000000_practice_commons_v1.sql \
            --file supabase/migrations/20260623002000_reading_practice_post_types.sql \
            --file supabase/migrations/20260623003000_reading_practice_spread_images.sql \
            --file supabase/migrations/20260625000000_reading_practice_field_note_consideration.sql \
            --file supabase/migrations/20260625001000_expand_reading_practice_post_types.sql \
            --file supabase/migrations/20260625002000_community_reports_and_locking.sql
      - name: Apply Stage 7 community migration
        shell: bash
        run: |
          psql "$STUDIO_STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --single-transaction --file supabase/migrations/20260923053000_deck_studio_community.sql
      - name: Verify privacy boundaries and reversible sharing
        shell: bash
        run: |
          psql "$STUDIO_STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --set project_id="$STUDIO_PROJECT_ID" <<'SQL'
          select set_config('app.studio_project_id', :'project_id', false);
          do $verify$
          declare
            target_project uuid := current_setting('app.studio_project_id')::uuid;
            audience_default text;
          begin
            if to_regclass('public.studio_community_shares') is null then
              raise exception 'Studio community share register is missing';
            end if;
            if not exists (
              select 1 from public.community_sections
              where key = 'deck-creation' and is_active = true
            ) then
              raise exception 'Deck Creation community section is missing';
            end if;
            select column_default into audience_default
            from information_schema.columns
            where table_schema = 'public' and table_name = 'community_posts' and column_name = 'audience';
            if audience_default not like '%members%' then
              raise exception 'New community posts do not default to members';
            end if;
            if (select count(*) from pg_policies where schemaname = 'public' and tablename = 'studio_community_shares') <> 2 then
              raise exception 'Studio community share policies are incomplete';
            end if;
            if (select count(*) from public.studio_card_families where project_id = target_project) <> 5
              or (select count(*) from public.studio_cards where project_id = target_project) <> 8
              or (select count(*) from public.studio_guidebook_sections where project_id = target_project) <> 22
              or (select count(*) from public.studio_import_records where project_id = target_project) <> 35 then
              raise exception 'Representative project counts changed';
            end if;
          end
          $verify$;

          begin;
          do $flow$
          declare
            target_project uuid := current_setting('app.studio_project_id')::uuid;
            target_owner uuid;
            entry_id uuid;
            excerpt_id uuid;
            share_result jsonb;
            share_id uuid;
            post_id uuid;
            private_body text;
          begin
            select owner_id into target_owner from public.studio_projects where id = target_project;
            if target_owner is null then raise exception 'Representative owner is missing'; end if;

            insert into public.studio_entitlements (
              user_id, plan_code, status, access_mode, manual_grant
            ) values (
              target_owner, 'studio', 'manual', 'write', true
            )
            on conflict (user_id) do update
            set status = 'manual', access_mode = 'write', manual_grant = true;

            insert into public.studio_journal_entries (
              project_id, entry_kind, title, body_markdown, selected_for_process
            ) values (
              target_project, 'reflection', 'Stage 7 private source',
              'Private source material that must never be copied implicitly.', true
            ) returning id, body_markdown into entry_id, private_body;

            insert into public.studio_journal_excerpts (
              project_id, journal_entry_id, purpose, title, excerpt_text
            ) values (
              target_project, entry_id, 'community',
              'Stage 7 controlled sharing validation',
              'A deliberately selected staging excerpt for reversible community sharing.'
            ) returning id into excerpt_id;

            perform set_config('request.jwt.claim.sub', target_owner::text, true);
            select public.studio_share_journal_excerpt(
              excerpt_id,
              'members',
              'progress_reflection',
              'stage-7-controlled-sharing-validation',
              true,
              false
            ) into share_result;

            if coalesce((share_result->>'ok')::boolean, false) is not true then
              raise exception 'Controlled share failed: %', share_result;
            end if;

            share_id := (share_result->>'share_id')::uuid;
            post_id := (share_result->>'post_id')::uuid;

            if not exists (
              select 1 from public.community_posts
              where id = post_id
                and audience = 'members'
                and source_kind = 'studio_excerpt'
                and deck_creation_topic = 'progress_reflection'
                and body = 'A deliberately selected staging excerpt for reversible community sharing.'
            ) then raise exception 'Community copy does not match the controlled excerpt'; end if;

            if (select body_markdown from public.studio_journal_entries where id = entry_id) <> private_body then
              raise exception 'Private source journal changed during sharing';
            end if;

            if coalesce((public.studio_withdraw_community_share(share_id)->>'ok')::boolean, false) is not true then
              raise exception 'Community share withdrawal failed';
            end if;

            if not exists (
              select 1 from public.community_posts where id = post_id and status = 'hidden'
            ) or not exists (
              select 1 from public.studio_community_shares where id = share_id and withdrawn_at is not null
            ) then raise exception 'Community copy was not withdrawn cleanly'; end if;
          end
          $flow$;
          rollback;

          select 'Stage 7 community staging verification passed.' as result;
          SQL
