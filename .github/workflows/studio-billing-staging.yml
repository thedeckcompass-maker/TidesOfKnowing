name: Deck Studio staging billing transaction

on:
  push:
    branches: [feature/deck-creator-studio-live]
    paths:
      - .github/workflows/studio-billing-staging.yml
      - supabase/migrations/20260923200000_deck_studio_billing_atomic_events.sql

permissions:
  contents: read

jobs:
  migrate-and-verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: deck-studio-staging
    env:
      STUDIO_STAGING_DATABASE_URL: ${{ secrets.STUDIO_STAGING_DATABASE_URL }}
      STUDIO_PROJECT_REF: utzcmbidotxgmulguzxo
      STUDIO_TEST_PROJECT: 2b55720e-1bfa-4cab-bf66-9bbe6c8f4d43
    steps:
      - name: Require isolated Studio staging database
        shell: bash
        run: |
          if [[ -z "$STUDIO_STAGING_DATABASE_URL" || "$STUDIO_STAGING_DATABASE_URL" != *"$STUDIO_PROJECT_REF"* ]]; then
            echo "::error::Isolated Studio staging connection is unavailable."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Apply atomic billing migration to staging only
        shell: bash
        run: |
          psql "$STUDIO_STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet \
            --file supabase/migrations/20260923200000_deck_studio_billing_atomic_events.sql
      - name: Verify billing effects in a rollback-only transaction
        shell: bash
        run: |
          psql "$STUDIO_STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet \
            --set project="$STUDIO_TEST_PROJECT" <<'SQL'
          select 1 / (case when
            has_function_privilege('service_role', 'public.studio_apply_test_billing_event(jsonb)', 'EXECUTE')
            and not has_function_privilege('authenticated', 'public.studio_apply_test_billing_event(jsonb)', 'EXECUTE')
            and not has_function_privilege('anon', 'public.studio_apply_test_billing_event(jsonb)', 'EXECUTE')
          then 1 else 0 end);
          select owner_id as creator from public.studio_projects where id = :'project'::uuid \gset
          begin;
          select set_config('studio.test.creator', :'creator', true);
          update public.studio_entitlements
            set stripe_subscription_id = 'sub_studio_rollback', paid_invoice_count = 0
            where user_id = :'creator'::uuid and plan_code = 'studio';
          insert into public.studio_checkout_reservations (user_id, plan_code, expires_at)
            values (:'creator'::uuid, 'studio', now() + interval '30 minutes') returning id as reservation \gset
          select set_config('request.jwt.claim.role', 'service_role', true);
          set local role service_role;
          select public.studio_apply_test_billing_event(jsonb_build_object(
            'event_id', 'evt_studio_rollback_checkout', 'type', 'checkout.session.completed',
            'object_id', 'cs_studio_rollback', 'event_created', extract(epoch from now())::bigint + 30,
            'livemode', false, 'user_id', :'creator', 'plan_code', 'studio',
            'reservation_id', :'reservation', 'subscription_id', 'sub_studio_rollback',
            'price_id', 'price_studio_rollback', 'minimum_payments', 1
          ));
          select 1 / (case when exists (
            select 1 from public.studio_checkout_reservations where id = :'reservation'::uuid
              and status = 'completed' and stripe_checkout_session_id = 'cs_studio_rollback'
          ) then 1 else 0 end);
          select public.studio_apply_test_billing_event(jsonb_build_object(
            'event_id', 'evt_studio_rollback_invoice', 'type', 'invoice.paid',
            'object_id', 'in_studio_rollback', 'invoice_id', 'in_studio_rollback',
            'event_created', extract(epoch from now())::bigint + 32,
            'livemode', false, 'subscription_id', 'sub_studio_rollback'
          ));
          select 1 / (case when (select paid_invoice_count from public.studio_entitlements
            where user_id = :'creator'::uuid) = 1 then 1 else 0 end);
          select 1 / (case when public.studio_apply_test_billing_event(jsonb_build_object(
            'event_id', 'evt_studio_rollback_invoice', 'type', 'invoice.paid',
            'object_id', 'in_studio_rollback', 'invoice_id', 'in_studio_rollback',
            'event_created', extract(epoch from now())::bigint + 32,
            'livemode', false, 'subscription_id', 'sub_studio_rollback'
          ))->>'duplicate' = 'true' then 1 else 0 end);
          select public.studio_apply_test_billing_event(jsonb_build_object(
            'event_id', 'evt_studio_rollback_invoice_again', 'type', 'invoice.paid',
            'object_id', 'in_studio_rollback', 'invoice_id', 'in_studio_rollback',
            'event_created', extract(epoch from now())::bigint + 33,
            'livemode', false, 'subscription_id', 'sub_studio_rollback'
          ));
          select 1 / (case when (select paid_invoice_count from public.studio_entitlements
            where user_id = :'creator'::uuid) = 1 then 1 else 0 end);
          select public.studio_apply_test_billing_event(jsonb_build_object(
            'event_id', 'evt_studio_rollback_late_failure', 'type', 'invoice.payment_failed',
            'object_id', 'in_studio_rollback', 'invoice_id', 'in_studio_rollback',
            'event_created', extract(epoch from now())::bigint + 31,
            'livemode', false, 'subscription_id', 'sub_studio_rollback'
          ));
          select 1 / (case when (select status from public.studio_entitlements
            where user_id = :'creator'::uuid) = 'active' then 1 else 0 end);
          select public.studio_apply_test_billing_event(jsonb_build_object(
            'event_id', 'evt_studio_rollback_canceled', 'type', 'customer.subscription.deleted',
            'object_id', 'sub_studio_rollback', 'event_created', extract(epoch from now())::bigint + 50,
            'livemode', false, 'user_id', :'creator', 'plan_code', 'studio',
            'subscription_id', 'sub_studio_rollback', 'price_id', 'price_studio_rollback',
            'status', 'canceled', 'access_mode', 'read_only', 'minimum_payments', 1
          ));
          select public.studio_apply_test_billing_event(jsonb_build_object(
            'event_id', 'evt_studio_rollback_old_active', 'type', 'customer.subscription.updated',
            'object_id', 'sub_studio_rollback', 'event_created', extract(epoch from now())::bigint + 40,
            'livemode', false, 'user_id', :'creator', 'plan_code', 'studio',
            'subscription_id', 'sub_studio_rollback', 'price_id', 'price_studio_rollback',
            'status', 'active', 'access_mode', 'write', 'minimum_payments', 1
          ));
          select 1 / (case when (select status from public.studio_entitlements
            where user_id = :'creator'::uuid) = 'canceled' then 1 else 0 end);
          do $$
          begin
            perform public.studio_apply_test_billing_event(jsonb_build_object(
              'event_id', 'evt_studio_rollback_bad_checkout', 'type', 'checkout.session.completed',
              'object_id', 'cs_studio_rollback_bad', 'event_created', extract(epoch from now())::bigint + 34,
              'livemode', false, 'user_id', current_setting('studio.test.creator'), 'plan_code', 'studio',
              'reservation_id', '00000000-0000-0000-0000-000000000001',
              'subscription_id', 'sub_studio_rollback', 'minimum_payments', 1
            ));
            raise exception 'Missing reservation was accepted';
          exception when others then
            if sqlerrm = 'Missing reservation was accepted' then raise; end if;
          end;
          $$;
          select 1 / (case when not exists (select 1 from public.studio_billing_events
            where stripe_event_id = 'evt_studio_rollback_bad_checkout') then 1 else 0 end);
          rollback;
          SQL
      - name: Inspect existing staging checkout without another payment
        shell: bash
        run: |
          psql "$STUDIO_STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet \
            --set project="$STUDIO_TEST_PROJECT" <<'SQL'
          select r.status, count(*) as reservations,
            count(e.id) filter (where e.outcome = 'completed') as completed_checkout_events,
            count(e.id) filter (where e.outcome in ('failed','processing')) as unresolved_checkout_events
          from public.studio_checkout_reservations r
          left join public.studio_billing_events e
            on e.object_id = r.stripe_checkout_session_id and e.event_type = 'checkout.session.completed'
          where r.user_id = (select owner_id from public.studio_projects where id = :'project'::uuid)
          group by r.status order by r.status;
          SQL
